/* ===== ТЕМА: меняйте цвета здесь ===== */
:root{
  --accent:#0E9F6E;        /* основной цвет (кнопки, акценты) */
  --accent-soft:#E3F6EE;   /* светлый фон акцента */
  --danger:#D64545; --danger-soft:#FCEBEB;
  --warn:#B7791F;   --warn-soft:#FDF3E1;
  --bg:#F4F6F5; --card:#FFFFFF; --text:#16211C; --muted:#6B7A72; --line:#E3E8E5;
  --radius:16px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --accent:#2BC48A; --accent-soft:#163A2C; --danger:#F07171; --danger-soft:#3A1E1E;
  --warn:#E8B04B; --warn-soft:#3A2F17;
  --bg:#0F1512; --card:#18201C; --text:#E8EFEB; --muted:#93A39A; --line:#26302B; color-scheme:dark; } }
:root[data-theme="dark"]{
  --accent:#2BC48A; --accent-soft:#163A2C; --danger:#F07171; --danger-soft:#3A1E1E;
  --warn:#E8B04B; --warn-soft:#3A2F17;
  --bg:#0F1512; --card:#18201C; --text:#E8EFEB; --muted:#93A39A; --line:#26302B; color-scheme:dark; }

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 90px}
h1{font-size:20px;margin:4px 2px 12px;font-weight:600}
h2{font-size:15px;margin:18px 4px 8px;color:var(--muted);font-weight:500}
.card{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:10px;border:1px solid var(--line)}
.hero{background:var(--accent);color:#fff;border:none}
.hero .lbl{opacity:.85;font-size:13px}
.hero .big{font-size:30px;font-weight:700;letter-spacing:-.5px;margin:2px 0 8px}
.hero .sub{display:flex;gap:16px;font-size:13px;opacity:.95}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{background:rgba(255,255,255,.18);border-radius:999px;padding:5px 11px;font-size:13px}
.tabs{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;margin:12px 0}
.tab{flex:1;text-align:center;padding:9px 4px;border-radius:9px;font-size:14px;color:var(--muted);cursor:pointer;user-select:none}
.tab.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.badge{display:inline-block;min-width:18px;padding:0 6px;border-radius:9px;background:var(--danger);color:#fff;font-size:11px;line-height:18px;margin-left:4px}
.search{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:15px;margin-bottom:10px;outline:none}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;cursor:pointer}
.row .main{flex:1;min-width:0}
.row .t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:12px;color:var(--muted)}
.amt{font-weight:600;white-space:nowrap}
.pos{color:var(--accent)} .neg{color:var(--danger)} .mut{color:var(--muted)}
.pill{font-size:11px;padding:3px 8px;border-radius:999px;white-space:nowrap}
.p-ok{background:var(--accent-soft);color:var(--accent)} .p-wait{background:var(--warn-soft);color:var(--warn)} .p-no{background:var(--danger-soft);color:var(--danger)}
.btn{display:block;width:100%;border:none;border-radius:14px;padding:15px;font-size:16px;font-weight:600;background:var(--accent);color:#fff;cursor:pointer}
.btn:disabled{opacity:.5}
.btn.sec{background:var(--accent-soft);color:var(--accent)}
.btn.ghost{background:transparent;color:var(--danger);border:1px solid var(--danger-soft)}
.btn.sm{display:inline-block;width:auto;padding:8px 12px;font-size:13px;border-radius:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat .v{font-size:20px;font-weight:700} .stat .k{font-size:12px;color:var(--muted)}
.kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line)} .kv:last-child{border:none}
.empty{text-align:center;color:var(--muted);padding:28px 10px}
label{display:block;font-size:13px;color:var(--muted);margin:12px 2px 6px}
input.f,select.f{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:17px;outline:none}
.filters{display:grid;gap:8px;margin:4px 0 12px}
.filters select.f{font-size:15px;padding:11px 12px;background:var(--card)}
.seg{display:flex;gap:8px;margin-top:4px}.seg .tab{border:1px solid var(--line);background:var(--card)}
/* Нижняя шторка */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:var(--card);border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));z-index:21;transform:translateY(105%);transition:transform .22s ease}
.sheet.open{transform:none}
.sheet .grab{width:40px;height:4px;background:var(--line);border-radius:2px;margin:0 auto 12px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:11px 16px;border-radius:12px;font-size:14px;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;text-align:center}
.toast.on{opacity:1}
/* Сканер */
.scanbtn{width:100%;aspect-ratio:2.2/1;border-radius:22px;border:none;background:var(--accent);color:#fff;font-size:20px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.scanbtn span{font-size:40px}
#cam{position:fixed;inset:0;background:#000;display:none;z-index:30}
#cam.open{display:block}
#cam video{width:100%;height:100%;object-fit:cover}
#cam .frame{position:absolute;top:45%;left:50%;width:64vmin;height:64vmin;transform:translate(-50%,-50%);border:3px solid rgba(255,255,255,.9);border-radius:18px;box-shadow:0 0 0 9999px rgba(0,0,0,.5)}
#cam .top{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;color:#fff}
#cam .bot{position:absolute;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:16px;right:16px;display:flex;gap:10px}
#cam .bot button{flex:1;padding:14px;border:none;border-radius:14px;font-size:16px;font-weight:600;color:#fff;background:rgba(255,255,255,.18)}
.result{border-radius:var(--radius);padding:16px;margin:12px 0;font-weight:500}
.r-ok{background:var(--accent-soft);color:var(--accent)} .r-no{background:var(--danger-soft);color:var(--danger)}
.loader{text-align:center;padding:60px 0;color:var(--muted)}

.lang{padding:5px 11px;border-radius:999px;font-size:13px;color:var(--muted);border:1px solid var(--line);background:var(--card);cursor:pointer;user-select:none}
.lang.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}

const LANGS = [['uz','Ўз'],['ru','Ру'],['en','En']];

/** Язык: сохранённый выбор → язык Telegram → ўзбекча */
function initLang(){
  try { const s = localStorage.getItem('lang'); if (I18N[s]) return s; } catch(e) {}
  const tl = String(window.Telegram?.WebApp?.initDataUnsafe?.user?.language_code || '').slice(0,2);
  return I18N[tl] ? tl : 'uz';
}
let LANG = initLang();
/** Текст по ключу с подстановками: T('hello','Икром') */
function T(key, ...a){
  const s = (I18N[LANG] && I18N[LANG][key]) ?? I18N.uz[key] ?? key;
  return s.replace(/\{(\d)\}/g, (m,i)=>a[i] ?? '');
}
function setLang(l){
  LANG = l;
  try { localStorage.setItem('lang', l); } catch(e) {}
  document.documentElement.lang = l;
  staticTexts();
  if (state.view) render();
}
/** Тексты вне главного экрана (камера, загрузка) */
function staticTexts(){
  const set=(sel,txt)=>{ const e=document.querySelector(sel); if(e) e.textContent=txt; };
  set('#cam .top', T('camHint')); set('#torchBtn', T('torch')); set('#camClose', T('close'));
}

 *  ОСНОВА
 *  tg — Telegram. Вне Telegram приложение не работает:
 *  показывается подсказка открыть его из бота.
 * ============================================================ */
const tg = window.Telegram && window.Telegram.WebApp;
/** Открыто ли приложение из Telegram (есть подписанные данные пользователя) */
const IN_TG = !!(tg && tg.initData);
if (tg) { tg.ready(); tg.expand(); try { tg.disableVerticalSwipes(); } catch (e) {} }

const $ = s => document.querySelector(s);
const app = $('#app');
let state = { view: null, tab: 'clients', search: '',
              obj: '',                      // агент: выбранный Object (дорихона)
              f: { region: '', group: '' }, // менеджер/админ: фильтр Регион → Группа
              roAgent: null };              // агент, открытый менеджером/админом (только чтение)

/** Формат денег: 1500000 → «1 500 000» */
function fmt(n){ const v=Math.round(Number(n)||0); return (v<0?'−':'')+String(Math.abs(v)).replace(/\B(?=(\d{3})+(?!\d))/g,' '); }
/** Деньги с валютой: «1 500 000 сўм» */
function money(n){ return fmt(n)+' '+T('sum'); }
/** Защита от вставки HTML в текст */
function esc(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
/** Короткая дата: «12.11 14:05» */
function shortTime(s){ const m=String(s||'').match(/^\d{4}-(\d{2})-(\d{2}) (\d{2}):(\d{2})/); return m? m[2]+'.'+m[1]+' '+m[3]+':'+m[4] : ''; }

/* ===== ФИЛЬТРЫ ===== */

/** Уникальные значения поля, по алфавиту: [{v, n}] — значение и сколько раз встречается */
function uniq(list, key){
  const m = {};
  list.forEach(x=>{ const k=String(x[key]||'').trim(); if(k) m[k]=(m[k]||0)+1; });
  return Object.keys(m).sort((a,b)=>a.localeCompare(b)).map(k=>({v:k,n:m[k]}));
}
/** <select> с первым пунктом «все»; id нужен для обработчика */
function selectBox(id, allLabel, opts, cur){
  return `<select class="f" id="${id}"><option value="">${esc(allLabel)}</option>${
    opts.map(o=>`<option value="${esc(o.v)}" ${o.v===cur?'selected':''}>${esc(o.v)}${o.n!=null?' ('+o.n+')':''}</option>`).join('')}</select>`;
}

/** Агент: выпадающий список Object (дорихона) + поиск */
function objectFilter(clients){
  const objs = uniq(clients, 'object');
  if (state.obj && !objs.some(o=>o.v===state.obj)) state.obj='';
  return `<div class="filters">
    ${objs.length>1 ? selectBox('objSel', T('allPharmacies', clients.length), objs, state.obj) : ''}
    <input class="search" id="search" style="margin:0" placeholder="${esc(T('searchPh'))}" value="${esc(state.search)}">
  </div>`;
}
/** Клиенты после фильтра Object и поиска */
function filterClients(clients){
  const q = state.search.toLowerCase();
  return clients.filter(c=>(!state.obj || c.object===state.obj) &&
    (!q || c.name.toLowerCase().includes(q) || String(c.person||'').toLowerCase().includes(q)));
}

/**
 * Менеджер/админ: Регион → Группа → Агент (выпадающие списки).
 * Список, в котором всего один вариант, не показывается.
 * Возвращает { html, list } — html фильтров и отфильтрованных агентов.
 */
function agentFilter(agents){
  const regions = uniq(agents, 'region');
  if (state.f.region && !regions.some(o=>o.v===state.f.region)) state.f.region='';
  const inRegion = agents.filter(a=>!state.f.region || a.region===state.f.region);
  const groups = uniq(inRegion, 'group');
  if (state.f.group && !groups.some(o=>o.v===state.f.group)) state.f.group='';
  const list = inRegion.filter(a=>!state.f.group || a.group===state.f.group);
  const html = `<div class="filters">
    ${regions.length>1 ? selectBox('regSel', T('allRegions'), regions, state.f.region) : ''}
    ${groups.length>1 ? selectBox('grpSel', T('allGroups'), groups, state.f.group) : ''}
    ${list.length>1 ? `<select class="f" id="agSel"><option value="">${esc(T('pickAgent', list.length))}</option>${
        list.map(a=>`<option value="${esc(a.id)}">${esc(a.name+' · '+a.group)}</option>`).join('')}</select>` : ''}
  </div>`;
  return { html, list };
}

/** Вибрация Telegram */
function haptic(t){ try{ tg && tg.HapticFeedback.notificationOccurred(t); }catch(e){} }
/** Короткое всплывающее сообщение */
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('on'),2600); }
/** Уникальный ключ формы: защищает от двойного нажатия «Юбориш» */
function opId(){ return 'F-'+Date.now()+'-'+Math.random().toString(36).slice(2,8); }

/* ============================================================
 *  ЗАПРОСЫ К СЕРВЕРУ
 *  Каждый запрос несёт подписанный Telegram initData и язык
 *  (сервер переводит на него свои сообщения об ошибках).
 *  Content-Type text/plain — чтобы Apps Script принял запрос без preflight.
 * ============================================================ */
async function api(action, data){
  const r = await fetch(API_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(Object.assign({ action, initData: tg.initData, lang: LANG }, data||{})) });
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || T('error'));
  return j.data;
}

/* ============================================================
 *  ЗАГРУЗКА ГЛАВНОГО ЭКРАНА
 * ============================================================ */
/**
 * Последний экран хранится на телефоне (ключ — Telegram ID, чтобы на общем
 * телефоне не показать чужие данные). При открытии он показывается сразу,
 * а свежие данные приходят с сервера в фоне.
 */
const VIEW_KEY = 'view_' + (tg && tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user.id : 'x');
function saveView(v){ try { localStorage.setItem(VIEW_KEY, JSON.stringify(v)); } catch(e) {} }
function cachedView(){ try { return JSON.parse(localStorage.getItem(VIEW_KEY) || 'null'); } catch(e) { return null; } }

async function load(){
  const old = cachedView();
  if (old && !state.view) { state.view = old; state.stale = true; render(); }
  try { state.view = await api('me'); state.stale = false; saveView(state.view); render(); }
  catch(e){
    if (state.view) { state.stale = false; render(); toast(e.message); }
    else { app.innerHTML = langBar()+'<div class="card"><b>⚠️ '+esc(e.message)+'</b></div>'; bindCommon(); }
  }
}

/** Переключатель языка вверху: Ўз · Ру · En */
function langBar(){
  return `<div class="langbar">${LANGS.map(([k,t])=>`<span class="lang ${LANG===k?'on':''}" data-lang="${k}">${t}</span>`).join('')}</div>`;
}

function render(){
  const v = state.view;
  let html = langBar();
  if (state.stale) html += `<div class="s mut" style="font-size:12px;text-align:center;margin:-2px 0 8px">⟳ ${T('loading')}</div>`;
  if (state.roAgent) html += roAgentScreen(state.roAgent);
  else if (v.role==='agent') html += agentScreen(v);
  else if (v.role==='client') html += clientScreen(v);
  else if (v.role==='manager') html += managerScreen(v);
  else html += adminScreen(v);
  app.innerHTML = html;
  bindCommon();
}

function payForm(type){
  const c = state.card, v = state.view;
  const id = opId();
  let body = `<h1 style="margin-top:0">${esc(c.name)}</h1>`;
  if (type==='ДЕНЬГИ'){
    body += `<label>${T('amountLbl', fmt(v.money.free))}</label>
      <input class="f" id="amount" inputmode="numeric" value="${c.balance>0?c.balance:''}" placeholder="0">
      <div class="s mut" style="font-size:12px;margin:6px 2px">${c.balance>0?T('hintPartial'):T('hintAdvance')}</div>`;
  } else {
    if (!v.gifts.length){ setSheet(body+`<div class="empty">${T('noGifts')}</div>`); return; }
    body += `<label>${T('giftLbl')}</label><select class="f" id="gift">${v.gifts.map(g=>`<option value="${esc(g.id)}" data-name="${esc(g.name)}">${esc(g.name)} (${g.free} ${T('pcs')})</option>`).join('')}</select>
      <label>${T('qtyLbl')}</label><input class="f" id="qty" inputmode="numeric" value="1">`;
  }
  body += `<div style="margin-top:16px"><button class="btn" id="send">${T('send')}</button></div>
    <div class="s mut" style="font-size:12px;text-align:center;margin-top:8px">${T('sendHint')}</div>`;
  setSheet(body);
  $('#send').onclick = async ()=>{
    const btn = $('#send');
    const data = { clientId:c.id, type, opId:id };
    if (type==='ДЕНЬГИ'){ data.amount = parseInt(String($('#amount').value).replace(/\D/g,''),10); if(!(data.amount>0)) return toast(T('enterAmount')); }
    else { data.giftId = $('#gift').value; data.qty = parseInt($('#qty').value,10); if(!(data.qty>0)) return toast(T('enterQty')); }
    const what = type==='ДЕНЬГИ' ? money(data.amount) : data.qty+' × '+$('#gift').selectedOptions[0].dataset.name;
    if (!(await confirmBox(T('confirmSend', c.name, what)))) return;
    btn.disabled = true; btn.textContent = T('sending');

      toast(T('sent')); state.tab='pending'; render();
    }catch(e){ haptic('error'); toast(e.message); btn.disabled=false; btn.textContent=T('send'); }
  };
}

/* ===== Камера и распознавание Data Matrix (zxing-wasm) ===== */
let stream=null, scanning=false, busy=false, torch=false;
const video=$('#video'), canvas=$('#canvas');
let ctx = null;
try { ctx = canvas.getContext('2d',{willReadFrequently:true}); } catch(e) {}
try{ ZXingWASM.prepareZXingModule({fireImmediately:true}); }catch(e){}

async function openCamera(){
  if (typeof ZXingWASM==='undefined' || !ctx) return toast(T('scanLibFail'));
  try{
    // 1920×1080 + непрерывный автофокус — как в первом сканере, который хорошо читал мелкий Data Matrix
    stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false});
    video.srcObject = stream; await video.play();
    try{
      const track = stream.getVideoTracks()[0];
      const caps = track.getCapabilities ? track.getCapabilities() : {};
      if (caps.focusMode && caps.focusMode.includes('continuous')) await track.applyConstraints({advanced:[{focusMode:'continuous'}]});
    }catch(e){}
    $('#cam').classList.add('open'); scanning=true; loop();
  }catch(e){ toast(T('camDenied')); }
}
function closeCamera(){ scanning=false; torch=false; if(stream) stream.getTracks().forEach(t=>t.stop()); stream=null; $('#cam').classList.remove('open'); }
async function loop(){
  if(!scanning) return;
  if(!busy && video.videoWidth){
    busy=true;
    try{
      const vw=video.videoWidth, vh=video.videoHeight, side=Math.floor(Math.min(vw,vh)*0.7);
      canvas.width=side; canvas.height=side;
      ctx.drawImage(video,(vw-side)/2,(vh-side)/2,side,side,0,0,side,side);
      const res = await ZXingWASM.readBarcodes(ctx.getImageData(0,0,side,side),{formats:['DataMatrix'],tryHarder:true,textMode:'Plain',maxNumberOfSymbols:1});
      if(scanning && res.length && res[0].isValid){ const raw=res[0].text; closeCamera(); sendScan(raw); }
    }catch(e){}
    busy=false;
  }
  if(scanning) setTimeout(loop,100);
}
$('#camClose').onclick = closeCamera;
$('#torchBtn').onclick = async ()=>{ const t=stream&&stream.getVideoTracks()[0]; if(!t) return; try{ torch=!torch; await t.applyConstraints({advanced:[{torch}]}); }catch(e){ toast(T('noTorch')); } };

  ${f.list.length ? f.list.map(agentRowAdmin).join('') : `<div class="empty">${T('agentNotFound')}</div>`}
  <h2>${T('advClients')}</h2>
  ${v.advances.length? v.advances.map(c=>`<div class="row"><div class="main"><div class="t">${esc(c.name)}</div><div class="s">${esc([c.group,c.agent].filter(Boolean).join(' · '))}</div></div><div class="amt neg">${fmt(c.balance)}</div></div>`).join('') : `<div class="empty">${T('noAdv')}</div>`}
  <div style="margin-top:14px"><button class="btn" id="adminPost">${T('postBtn')}</button></div>
  <div class="s mut" style="font-size:12px;text-align:center;margin-top:8px">${T('postHint')}</div>`;
}

/* ============================================================
 *  ЭКРАН МЕНЕДЖЕРА (только просмотр): его агенты и их цифры
 * ============================================================ */
function managerScreen(v){
  const f = agentFilter(v.agents);
  const tot = f.list.reduce((s,a)=>({free:s.free+a.free,toPay:s.toPay+a.toPay,adv:s.adv+a.advances,pend:s.pend+a.pending}),{free:0,toPay:0,adv:0,pend:0});
  return `<h1>${esc(T('hello', v.name))}</h1>
  <div class="s mut" style="margin:-6px 2px 10px">${T('readOnly')}</div>
  <div class="grid2">
    <div class="stat"><div class="v">${fmt(tot.free)}</div><div class="k">${T('agentsBalance')}</div></div>
    <div class="stat"><div class="v">${fmt(tot.toPay)}</div><div class="k">${T('toPayClients')}</div></div>
    <div class="stat"><div class="v">${tot.pend}</div><div class="k">${T('pendingCnt')}</div></div>
    <div class="stat"><div class="v neg">${fmt(tot.adv)}</div><div class="k">${T('advances')}</div></div>
  </div>
  <h2>${T('agents')}</h2>
  ${f.html}
  ${f.list.length ? f.list.map(a=>`<div class="row" data-ro-agent="${esc(a.id)}">
    <div class="main"><div class="t">${esc(a.name)}</div>
      <div class="s">${esc([a.region,a.group].filter(Boolean).join(' · '))} · ${T('clientsN', a.clients)}${a.pending?' · ⏳ '+a.pending:''}${a.registered?'':' · '+T('notRegistered')}${a.gifts.length?' · 🎁 '+esc(a.gifts.join(', ')):''}</div></div>
    <div style="text-align:right"><div class="amt">${fmt(a.free)}</div><div class="s mut" style="font-size:12px">${T('toPay', fmt(a.toPay))}</div></div>
  </div>`).join('') : `<div class="empty">${v.agents.length?T('agentNotFound'):T('noAgents')}</div>`}`;
}

/** Агент глазами менеджера или админа: баланс, клиенты, ожидания. Без кнопок действий */
function roAgentScreen(v){
  const gifts = giftChips(v);
  const list = filterClients(v.clients);
  return `<button class="btn sec sm" id="roBack">${T('back')}</button>
  <h1 style="margin-top:12px">${esc(v.name)}</h1>
  <div class="card hero"><div class="lbl">${esc(T('balance', v.group))}</div><div class="big">${money(v.money.free)}</div>
    <div class="sub"><span>${T('waitingAmt', fmt(v.money.frozen))}</span></div>${gifts?`<div class="chips">${gifts}</div>`:''}</div>
  ${v.pending.length?`<h2>${T('pendingCnt')}</h2>`+v.pending.map(p=>`<div class="row"><div class="main"><div class="t">${esc(p.client)}</div><div class="s">${shortTime(p.created)}</div></div><div class="amt">${payLabel(p)}</div></div>`).join(''):''}
  <h2>${T('clientsCount', v.clients.length)}</h2>
  ${objectFilter(v.clients)}
  ${list.length ? list.map(c=>clientRow(c, false)).join('') : `<div class="empty">${T('clientNotFound')}</div>`}`;
}

/** Менеджер или админ открывает агента (только чтение) */
async function openRoAgent(id){
  if (!id) return;
  try{
    state.roAgent = await api(state.view.role==='admin' ? 'adminAgent' : 'managerAgent', { agentId:id });
    state.search=''; state.obj=''; render(); try{ window.scrollTo(0,0); }catch(e){}
  }catch(e){ toast(e.message); }
}

/** Админ: провести новые строки пополнений и подарков */
async function adminPost(){
  const b=$('#adminPost'); b.disabled=true; b.textContent=T('running');
  try{ const r=await api('adminPost'); state.view=r.view; render(); toast(r.text); }
  catch(e){ toast(e.message); b.disabled=false; b.textContent=T('postBtn'); }
}

/* ============================================================
 *  ШТОРКА, ПОДТВЕРЖДЕНИЕ, ОБРАБОТЧИКИ
 * ============================================================ */
function openSheet(html){ $('#sheetBody').innerHTML=html; $('#sheetBg').style.display='block'; requestAnimationFrame(()=>$('#sheet').classList.add('open')); }
function setSheet(html){ $('#sheetBody').innerHTML=html; }
function closeSheet(){ $('#sheet').classList.remove('open'); $('#sheetBg').style.display='none'; }
$('#sheetBg').onclick = closeSheet;

/** Окно «Да / Нет»: в Telegram — родное окно, в просмотре — confirm() */
function confirmBox(text){
  return new Promise(res=>{
    if (tg && IN_TG && tg.showConfirm) tg.showConfirm(text, ok=>res(!!ok));
    else res(window.confirm(text));
  });
}

/** Привязка кнопок после каждой отрисовки */
function bindCommon(){
  document.querySelectorAll('[data-lang]').forEach(el=>el.onclick=()=>setLang(el.dataset.lang));
  document.querySelectorAll('[data-tab]').forEach(el=>el.onclick=()=>{ state.tab=el.dataset.tab; render(); });
  document.querySelectorAll('[data-client]').forEach(el=>el.onclick=()=>openClient(el.dataset.client));
  document.querySelectorAll('[data-cancel]').forEach(el=>el.onclick=()=>cancelPayout(el.dataset.cancel));
  const s=$('#search'); if(s){ s.oninput=()=>{
    state.search=s.value; clearTimeout(bindCommon._t);
    bindCommon._t=setTimeout(()=>{ const pos=s.selectionStart; render(); const n=$('#search'); if(n){ n.focus(); n.setSelectionRange(pos,pos); } }, 200);
  }; }
  const sb=$('#scanBtn'); if(sb) sb.onclick=openCamera;
  document.querySelectorAll('[data-ro-agent]').forEach(el=>el.onclick=()=>openRoAgent(el.dataset.roAgent));
  const rb=$('#roBack'); if(rb) rb.onclick=()=>{ state.roAgent=null; state.search=''; state.obj=''; render(); };
  const os=$('#objSel'); if(os) os.onchange=()=>{ state.obj=os.value; render(); };
  const rs=$('#regSel'); if(rs) rs.onchange=()=>{ state.f.region=rs.value; state.f.group=''; render(); };
  const gs=$('#grpSel'); if(gs) gs.onchange=()=>{ state.f.group=gs.value; render(); };
  const as=$('#agSel'); if(as) as.onchange=()=>openRoAgent(as.value);
  const ap=$('#adminPost'); if(ap) ap.onclick=adminPost;
}

document.documentElement.lang = LANG;
staticTexts();
if (IN_TG) {
  $('#app').innerHTML = `<div class="loader">${T('loading')}</div>`;
  load();
} else {
  // Открыто не из Telegram (обычный браузер): данных нет, только подсказка
  const showOutside = ()=>{ app.innerHTML = langBar()+`<div class="card" style="text-align:center;padding:28px 16px">📲<br><br>${T('openInTg')}</div>`;
    document.querySelectorAll('[data-lang]').forEach(el=>el.onclick=()=>{ setLang(el.dataset.lang); showOutside(); }); };
  showOutside();
}
</script>
</body>
</html>
